<!-- RELATÓRIOS -->
<section id="relatorios" class="hidden bg-white p-6 rounded-xl border shadow-sm modo-rh-secao space-y-6">
    <div class="flex justify-between items-center border-b pb-4">
        <div>
            <h2 class="text-xl font-bold text-blue-950 flex items-center gap-2">📊 Central de Relatórios Corporativos</h2>
            <p class="text-xs text-slate-500 mt-1">Gere, filtre e exporte relatórios consolidados em Excel para auditoria, contabilidade e diretoria.</p>
        </div>
        <button id="btn-exportar-relatorio-etapa13" class="bg-blue-900 hover:bg-blue-800 text-white font-bold px-5 py-2.5 rounded-xl text-xs transition shadow-md flex items-center gap-2">
            📥 Exportar Relatório Atual (Excel)
        </button>
    </div>

    <!-- Abas reduzidas apenas para Prestadores, Contratos e Financeiro -->
    <div class="grid grid-cols-3 md:grid-cols-6 gap-2 bg-slate-100 p-2 rounded-2xl border text-xs font-bold">
        <button onclick="mudarTipoRelatorioEtapa13('prestadores')" id="tab-rel-prestadores" class="py-2.5 px-3 rounded-xl bg-blue-900 text-white transition shadow-sm">Prestadores</button>
        <button onclick="mudarTipoRelatorioEtapa13('contratos')" id="tab-rel-contratos" class="py-2.5 px-3 rounded-xl text-slate-700 hover:bg-white transition">Contratos</button>
        <button onclick="mudarTipoRelatorioEtapa13('financeiro')" id="tab-rel-financeiro" class="py-2.5 px-3 rounded-xl text-slate-700 hover:bg-white transition">Financeiro</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 bg-slate-50 p-4 rounded-xl border text-xs">
        <div id="bloco-filtro-competencia">
            <label id="label-filtro-competencia" class="block font-bold text-slate-700 mb-1">Competência Referência</label>
            <select id="relFiltroCompetencia" class="w-full p-2 border rounded bg-white font-bold text-blue-900"></select>
        </div>
        <div id="bloco-filtro-centro-custo">
            <label id="label-filtro-centro-custo" class="block font-bold text-slate-700 mb-1">Centro de Custo</label>
            <select id="relFiltroCentroCusto" class="w-full p-2 border rounded bg-white"><option value="todos">-- Todos os Centros --</option></select>
        </div>
        <div>
            <label class="block font-bold text-slate-700 mb-1">Prestador PJ</label>
            <select id="relFiltroPrestador" class="w-full p-2 border rounded bg-white"><option value="todos">-- Todos os Prestadores --</option></select>
        </div>
        <div>
            <label id="label-filtro-especifico" class="block font-bold text-slate-700 mb-1">Status / NF</label>
            <select id="relFiltroStatusEspecifico" class="w-full p-2 border rounded bg-white">
                <option value="todos">-- Todos --</option>
            </select>
        </div>
    </div>

    <div class="overflow-x-auto border rounded-xl shadow-inner bg-white">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr id="relatorio-cabecalho-tabela" class="bg-blue-950 text-white text-[11px] font-bold"></tr>
            </thead>
            <tbody id="tabelaRelatorioCorpo" class="text-xs">
                <tr><td colspan="8" class="p-4 text-center text-slate-400">Nenhum registro encontrado.</td></tr>
            </tbody>
            <tfoot>
                <tr id="relatorio-linha-rodape" class="bg-slate-100 border-t font-bold text-xs">
                    <td id="relatorio-coluna-total-label" colspan="7" class="p-3 text-right text-slate-700 uppercase tracking-wider">TOTAL CONSOLIDADO:</td>
                    <td id="relatorioTotalGeral" class="p-3 text-right text-blue-950 text-sm">R$ 0,00</td>
                </tr>
            </tfoot>
        </table>
    </div>
</section>
